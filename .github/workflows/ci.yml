name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raelo

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: raelo
          POSTGRES_PASSWORD: raelo
          POSTGRES_DB: raelo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raelo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://raelo:raelo@localhost:5432/raelo
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raelo/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Applies every migration (twice, to prove the runner skips applied
      # ones) and the seed to a fresh Postgres.
      - run: npm run db:migrate
      - run: npm run db:migrate

      - run: npm run build
